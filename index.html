<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCI-NOTATION LAB — ห้องทดลองสัญกรณ์วิทยาศาสตร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onerror="window.__QR_FAIL=true"></script>
<style>
:root{
  --navy:#13235B; --navy2:#1E3A8A; --blue:#2563EB; --sky:#38BDF8;
  --purple:#7C3AED; --purple2:#A855F7; --yellow:#FACC15; --amber:#F59E0B;
  --green:#059669; --red:#DC2626; --ink:#0F172A; --muted:#64748B;
  --line:#E2E8F0; --bg:#F5F7FF; --white:#fff;
  --grad:linear-gradient(135deg,#1E3A8A 0%,#4338CA 45%,#7C3AED 100%);
  --grad2:linear-gradient(135deg,#2563EB 0%,#38BDF8 100%);
  --grad3:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%);
  --r:16px; --sh:0 6px 24px rgba(19,35,91,.10); --sh2:0 12px 32px rgba(19,35,91,.18);
  --dur:.35s;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.dsp{font-family:'Kanit',sans-serif;font-weight:600;line-height:1.3;margin:0 0 .4em}
.mono,.num{font-family:'JetBrains Mono',monospace}
button,input,select,textarea{font-family:inherit;font-size:1rem}
a{color:var(--blue)}
.hidden{display:none !important}
body.reduce-motion *{animation:none !important;transition:none !important}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:var(--sh)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'Kanit';font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;font-size:1.05rem}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(250,204,21,.25)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.18)}
.chip.on{background:rgba(5,150,105,.25);border-color:#34D399}
.chip.off{background:rgba(245,158,11,.22);border-color:#FCD34D}
.chip.err{background:rgba(220,38,38,.25);border-color:#FCA5A5}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.tight{padding:14px}
.card h3{margin-top:0}
.stat{background:#fff;border-radius:var(--r);padding:16px;border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--grad2)}
.stat .lb{color:var(--muted);font-size:.86rem;font-weight:600}
.stat .vl{font-family:'Kanit';font-size:1.9rem;font-weight:700;color:var(--navy2);line-height:1.15}
.stat.p:before{background:var(--grad3)} .stat.y:before{background:linear-gradient(135deg,#F59E0B,#FACC15)}
.stat.g:before{background:linear-gradient(135deg,#059669,#34D399)} .stat.r:before{background:linear-gradient(135deg,#DC2626,#F87171)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid transparent;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;transition:transform var(--dur),box-shadow var(--dur),background var(--dur);font-family:'Kanit'}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn.pri{background:var(--grad)}
.btn.acc{background:linear-gradient(135deg,#F59E0B,#FACC15);color:#3B2A00}
.btn.ok{background:var(--green)} .btn.dg{background:var(--red)}
.btn.gh{background:#fff;color:var(--navy2);border-color:#C7D2FE}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.86rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.block{width:100%}

/* ---------- forms ---------- */
label.f{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px;color:var(--navy)}
.inp,select.inp,textarea.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border var(--dur)}
.inp:focus{border-color:var(--blue)}
.err-msg{color:var(--red);font-size:.85rem;font-weight:600;margin-top:4px}
.hint{color:var(--muted);font-size:.86rem}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px}
th{background:#EEF2FF;color:var(--navy);text-align:left;padding:11px 12px;font-family:'Kanit';font-weight:600;font-size:.88rem;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid var(--line);font-size:.92rem;vertical-align:top}
tr:hover td{background:#F8FAFF}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.bg-e{background:#DCFCE7;color:#166534}.bg-m{background:#FEF3C7;color:#92400E}.bg-h{background:#FEE2E2;color:#991B1B}
.bg-b{background:#DBEAFE;color:#1E40AF}.bg-p{background:#EDE9FE;color:#5B21B6}.bg-x{background:#F1F5F9;color:#475569}

/* ---------- landing ---------- */
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:36px 24px;position:relative;overflow:hidden;text-align:center}
.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.35),transparent 65%);top:-160px;right:-120px}
.hero h1{font-size:clamp(1.7rem,5.5vw,2.9rem);margin-bottom:6px;letter-spacing:.5px}
.hero p{opacity:.92;margin:0 auto;max-width:640px}
.role{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);margin-top:22px;position:relative;z-index:2}
@media(max-width:560px){.role{grid-template-columns:1fr}}
.role button{background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:24px 16px;cursor:pointer;text-align:center;transition:all var(--dur);font-family:'Kanit'}
.role button:hover{background:rgba(255,255,255,.2);transform:translateY(-4px)}
.role .ico{font-size:2.6rem;display:block;margin-bottom:6px}
.role .t{font-size:1.15rem;font-weight:600} .role .s{font-size:.85rem;opacity:.85;font-family:'Sarabun'}

/* ---------- signature: decimal track ---------- */
.dtrack{background:var(--navy);border-radius:14px;padding:16px 12px;color:#fff;overflow-x:auto}
.digits{display:flex;justify-content:center;align-items:flex-end;gap:2px;font-family:'JetBrains Mono';font-size:clamp(1.2rem,5vw,1.9rem);font-weight:700;position:relative;min-height:56px}
.digits span{min-width:1ch;text-align:center;padding:2px 1px;border-radius:6px}
.digits span.hi{background:rgba(250,204,21,.22);color:var(--yellow)}
.dp{color:var(--yellow);font-size:1.6em;line-height:.6;transition:transform .45s cubic-bezier(.5,-0.3,.3,1.4)}
.dmeta{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:#C7D2FE;margin-top:8px;font-family:'Sarabun'}
.sci{font-family:'JetBrains Mono';font-weight:700;color:var(--yellow);font-size:1.3rem;text-align:center;margin-top:6px}
.sci sup{font-size:.72em}

/* ---------- progress ---------- */
.pbar{height:14px;background:#E2E8F0;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad2);border-radius:999px;transition:width .6s ease}
.pbar.gold i{background:linear-gradient(90deg,#F59E0B,#FACC15)}
.pmini{height:8px}

/* ---------- menus ---------- */
.menu{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.menu{grid-template-columns:repeat(2,1fr)}}
.menu button{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px 12px;cursor:pointer;text-align:center;transition:all var(--dur);box-shadow:var(--sh);font-family:'Kanit';font-weight:600;color:var(--navy)}
.menu button:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:var(--sh2)}
.menu .ico{display:block;font-size:2rem;margin-bottom:4px}
.menu .sub{display:block;font-size:.78rem;color:var(--muted);font-weight:400;font-family:'Sarabun'}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-family:'Kanit';color:var(--navy);min-height:40px}
.tabs button.act{background:var(--navy2);color:#fff;border-color:var(--navy2)}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-title{font-family:'Kanit';font-size:1.35rem;font-weight:600;color:var(--navy);margin:0}

/* ---------- feedback ---------- */
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600;border:1.5px solid;animation:pop .3s ease}
.fb.ok{background:#ECFDF5;border-color:#6EE7B7;color:#065F46}
.fb.no{background:#FEF2F2;border-color:#FCA5A5;color:#991B1B}
.fb .ex{font-weight:400;color:#334155;margin-top:6px;font-size:.92rem}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.pulse{animation:float 2.4s ease-in-out infinite}

/* ---------- choices ---------- */
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:all var(--dur);width:100%;min-height:52px}
.choice:hover{border-color:var(--blue);background:#F8FAFF}
.choice .k{flex:0 0 30px;height:30px;border-radius:9px;background:#EEF2FF;color:var(--navy2);font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Kanit'}
.choice.sel{border-color:var(--blue);background:#EFF6FF}.choice.sel .k{background:var(--blue);color:#fff}
.choice.right{border-color:var(--green);background:#ECFDF5}.choice.right .k{background:var(--green);color:#fff}
.choice.wrong{border-color:var(--red);background:#FEF2F2}.choice.wrong .k{background:var(--red);color:#fff}
.choice .tx{font-family:'JetBrains Mono';font-weight:700;padding-top:2px}

/* ---------- game ---------- */
.gamehud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;font-family:'Kanit'}
.gamehud b{color:var(--yellow)}
.space{background:radial-gradient(circle at 20% 20%,#1E3A8A,#0B1437 70%);border-radius:20px;padding:22px 16px;color:#fff;text-align:center;position:relative;overflow:hidden}
.space .planet{font-size:3rem;display:block}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#93C5FD,transparent),radial-gradient(1.5px 1.5px at 220px 40px,#FACC15,transparent),radial-gradient(1px 1px at 300px 120px,#fff,transparent);opacity:.6}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ico{font-size:2.6rem;display:block;margin-bottom:6px}
.load{display:inline-block;width:20px;height:20px;border:3px solid #C7D2FE;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-4px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast-box{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--sh2);font-weight:600;animation:pop .25s}
.toast.ok{background:var(--green)} .toast.no{background:var(--red)} .toast.warn{background:var(--amber);color:#3B2A00}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal .box{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:20px;max-height:92vh;overflow:auto;box-shadow:var(--sh2)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.94rem}
.kv b{font-family:'Kanit';color:var(--navy)}
.badge-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:center;transition:all var(--dur)}
.badge-card.got{border-color:var(--yellow);background:linear-gradient(180deg,#FFFBEB,#fff);box-shadow:0 6px 18px rgba(245,158,11,.22)}
.badge-card .ico{font-size:2.2rem;display:block;filter:grayscale(1);opacity:.4}
.badge-card.got .ico{filter:none;opacity:1}
.qr-box{background:#fff;border:2px dashed #C7D2FE;border-radius:18px;padding:18px;text-align:center}
.joincode{font-family:'JetBrains Mono';font-weight:700;font-size:1.6rem;letter-spacing:2px;color:var(--navy2);background:#EEF2FF;border-radius:12px;padding:8px 14px;display:inline-block}
.sidebar-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.sidebar-nav button{white-space:nowrap}
.lesson-nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-grid button{min-height:52px}
.sortable li{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sortable{list-style:none;padding:0;margin:0;counter-reset:s}
.sortable li .n{width:26px;height:26px;border-radius:8px;background:#EEF2FF;color:var(--navy2);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85rem}
@media print{.noprint{display:none !important}body{background:#fff}}
</style>
</head>
<body>
<header class="topbar noprint">
  <div class="in">
    <div class="brand"><span class="dot"></span> SCI-NOTATION LAB</div>
    <div class="spacer"></div>
    <span id="syncChip" class="chip off" title="สถานะการเชื่อมต่อฐานข้อมูล">🟡 Offline Mode</span>
    <button class="btn gh sm" onclick="toggleMotion()" id="motionBtn">🎬 ลด Animation</button>
    <button class="btn gh sm" onclick="goHome()">🏠 หน้าแรก</button>
  </div>
</header>

<main class="wrap" id="view" role="main"></main>
<div class="toast-box" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<footer class="wrap noprint" style="color:#64748B;font-size:.84rem;text-align:center;padding-bottom:30px">
  SCI-NOTATION LAB · ห้องทดลองสัญกรณ์วิทยาศาสตร์ · คณิตศาสตร์ ม.1
</footer>
<script>
/* ============================================================
   SCI-NOTATION LAB — Learning Management Web App
   วิชาคณิตศาสตร์ ม.1 : สัญกรณ์วิทยาศาสตร์
   Frontend: HTML/CSS/JS  |  Backend (ตัวเลือก): Google Apps Script + Google Sheets
   Fallback: LocalStorage
   ============================================================ */

/* ---------- CONFIG : แก้ไขค่าที่นี่ที่เดียว ---------- */
const CONFIG = {
  API_URL: "",                 // ใส่ URL ของ Google Apps Script Web App ที่นี่ (เว้นว่าง = Offline Mode)
  TEACHER_PIN: "123456",       // เดโมเท่านั้น — ระบบจริงให้ตรวจสอบฝั่ง Server
  MAX_QUIZ_QUESTIONS: 10,      // แบบทดสอบแต่ละครั้งไม่เกิน 10 ข้อ
  DEFAULT_DIFFICULTY: "easy",  // ระดับเริ่มต้นของแบบทดสอบ = ง่าย
  PASS_PERCENT: 60,
  POINTS: { lesson: 100, activity: 200, game: 300, quiz: 400 }
};

const STORE_KEY = "SCINOTE_DB_V1";
const CUR_KEY   = "SCINOTE_CURRENT_STUDENT";
const MOTION_KEY= "SCINOTE_REDUCE_MOTION";

/* ---------- helpers ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const fmtDT = s => { if (!s) return "-"; const d = new Date(s); return isNaN(d) ? "-" : d.toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" }); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : 0;
const comma = n => Number(n).toLocaleString("en-US");
const DIFF = { easy: { th: "ง่าย", ic: "🟢", cls: "bg-e" }, medium: { th: "ปานกลาง", ic: "🟡", cls: "bg-m" }, hard: { th: "ยาก", ic: "🔴", cls: "bg-h" } };
const TOPICS = {
  t1: "ความหมายของสัญกรณ์วิทยาศาสตร์",
  t2: "จำนวนมาก",
  t3: "จำนวนที่น้อยมาก",
  t4: "เลขชี้กำลังบวก",
  t5: "เลขชี้กำลังลบ",
  t6: "การเปลี่ยนกลับเป็นจำนวนปกติ"
};
function sciHTML(a, n) { return `${esc(a)} × 10<sup>${esc(n)}</sup>`; }
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.innerHTML = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 2800);
}
function normAns(s) {
  return String(s == null ? "" : s).trim().replace(/\s+/g, "").replace(/,/g, "")
    .replace(/[xX×∗*]/g, "x").replace(/\^/g, "^").replace(/−/g, "-").toLowerCase();
}
function toggleMotion() {
  const on = !document.body.classList.contains("reduce-motion");
  document.body.classList.toggle("reduce-motion", on);
  localStorage.setItem(MOTION_KEY, on ? "1" : "0");
  $("#motionBtn").textContent = on ? "🎬 เปิด Animation" : "🎬 ลด Animation";
}

/* ============================================================
   DATA LAYER — LocalStorage + (ตัวเลือก) Google Sheets ผ่าน GAS
   ============================================================ */
let DB = null;
let SYNC = { status: "offline", queue: [] };

function blankDB() {
  return { students: [], questions: [], quizzes: [], sessions: [], attempts: [], answers: [], activities: [], games: [], lessons: [], classes: [], meta: { seeded: false } };
}
function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    DB = raw ? JSON.parse(raw) : blankDB();
  } catch (e) { console.warn("อ่านข้อมูลเดิมไม่ได้ เริ่มใหม่", e); DB = blankDB(); }
  const b = blankDB(); Object.keys(b).forEach(k => { if (!DB[k]) DB[k] = b[k]; });
}
function saveDB() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch (e) { toast("⚠️ พื้นที่จัดเก็บในเครื่องเต็ม", "no"); }
}
function resetDB() {
  if (!confirm("ล้างข้อมูลทั้งหมดในเครื่องและโหลดข้อมูลตัวอย่างใหม่?")) return;
  localStorage.removeItem(STORE_KEY); localStorage.removeItem(CUR_KEY);
  loadDB(); seedData(); saveDB(); goHome(); toast("รีเซ็ตข้อมูลเรียบร้อย", "ok");
}

/* --- API service (Google Apps Script) --- */
async function apiCall(path, payload) {
  if (!CONFIG.API_URL) throw new Error("ยังไม่ได้ตั้งค่า API_URL");
  const res = await fetch(CONFIG.API_URL + "?path=" + encodeURIComponent(path), {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // เลี่ยง CORS preflight ของ GAS
    body: JSON.stringify(payload || {})
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "API error");
  return j.data;
}
function queueSync(type, record) {
  SYNC.queue.push({ type, record, at: nowISO() });
  if (CONFIG.API_URL) syncNow(true);
  renderSyncChip();
}
async function syncNow(silent) {
  if (!CONFIG.API_URL) { SYNC.status = "offline"; renderSyncChip(); if (!silent) toast("🟡 ยังไม่ได้เชื่อม Google Sheets — ข้อมูลถูกเก็บไว้ในเครื่อง", "warn"); return; }
  if (!SYNC.queue.length) { SYNC.status = "synced"; renderSyncChip(); if (!silent) toast("✅ ข้อมูลตรงกันแล้ว", "ok"); return; }
  SYNC.status = "syncing"; renderSyncChip();
  const batch = SYNC.queue.slice();
  try {
    await apiCall("sync", { records: batch });       // ฝั่ง GAS ตรวจ id ซ้ำก่อนบันทึก
    SYNC.queue = SYNC.queue.slice(batch.length);
    SYNC.status = "synced"; if (!silent) toast("✅ ส่งข้อมูลขึ้น Google Sheets แล้ว", "ok");
  } catch (e) {
    SYNC.status = "error";
    if (!silent) toast("⚠️ เชื่อมต่อฐานข้อมูลไม่ได้ ระบบบันทึกข้อมูลไว้ในเครื่องแล้ว", "warn");
  }
  renderSyncChip();
}
function renderSyncChip() {
  const c = $("#syncChip"); if (!c) return;
  const m = {
    offline: ["chip off", "🟡 Offline Mode"],
    synced: ["chip on", "🟢 Connected to Google Sheets"],
    syncing: ["chip", "🔄 Syncing…"],
    waiting: ["chip off", "⏳ Waiting"],
    error: ["chip err", "⚠️ Sync Error"]
  }[SYNC.status] || ["chip off", "🟡 Offline Mode"];
  c.className = m[0]; c.textContent = m[1] + (SYNC.queue.length ? ` (${SYNC.queue.length})` : "");
}

    [["QZ001", "SCI-M1-DEMO", d[2]], ["QZ002", "SCI-M1-POST", d[3]]].forEach(([qz, ss, key]) => {
      const quiz = DB.quizzes.find(q => q.quizId === qz);
      const aid = uid("A");
      let score = 0;
      quiz.questionIds.forEach((qid, k) => {
        const q = DB.questions.find(x => x.questionId === qid);
        const ok = !!key[k];
        if (ok) score += q.points;
        DB.answers.push({ attemptId: aid, questionId: qid, selectedAnswer: ok ? q.answer : (q.answer === "A" ? "B" : "A"), correctAnswer: q.answer, isCorrect: ok, points: ok ? q.points : 0 });
      });
      const total = quiz.questionIds.reduce((s, qid) => s + DB.questions.find(x => x.questionId === qid).points, 0);
      DB.attempts.push({ attemptId: aid, sessionId: ss, quizId: qz, studentId: sid, kind: quiz.kind, startTime: nowISO(), submitTime: nowISO(), score, totalPoints: total, percentage: pct(score, total), durationSec: 300 + i * 40 });
    });
    DB.activities.push({ activityId: uid("AC"), studentId: sid, activityType: "shift", score: 40 + i * 3, createdAt: nowISO() });
    DB.games.push({ gameId: uid("G"), studentId: sid, level: 7 + (i % 3), score: 180 + i * 20, createdAt: nowISO() });
    [1, 2, 3].forEach(n => DB.lessons.push({ studentId: sid, lessonId: n, completedAt: nowISO() }));
  });

  DB.meta.seeded = true;
  saveDB();
}

function after_landing() {
  const seq = [["150000000", 8], ["0.000034", -5]];
  let i = 0, step = 0;
  const tick = () => {
    const t = $("#heroTrack"); if (!t) { clearInterval(window.__heroTimer); return; }
    const [n, target] = seq[i];

    const cur = dir * step;
    t.innerHTML = trackHTML(n, cur);

/* ============================================================
   SIGNATURE WIDGET — แถบเลื่อนจุดทศนิยม
   ============================================================ */
function parseNum(numStr) {
  let s = String(numStr).replace(/[,\s]/g, "");
  let neg = s.startsWith("-"); if (neg) s = s.slice(1);
  let [ip, fp] = s.split("."); ip = ip || "0"; fp = fp || "";
  return { digits: ip + fp, point: ip.length, neg };
}
/** เลื่อนจุดทศนิยม shift ตำแหน่งไปทางซ้าย (shift>0) แล้วคืนค่าสตริงของ a */
function shiftNum(numStr, shift) {
  const { digits, point, neg } = parseNum(numStr);
  let np = point - shift, d = digits, pad = "";
  if (np <= 0) { pad = "0." + "0".repeat(-np); d = pad + d; }
  else if (np >= d.length) { d = d + "0".repeat(np - d.length); }
  else { d = d.slice(0, np) + "." + d.slice(np); }
  d = d.replace(/^0+(?=\d)/, "");
  if (d.includes(".")) d = d.replace(/0+$/, "").replace(/\.$/, "");
  if (d === "" || d === ".") d = "0";
  return (neg ? "-" : "") + d;
}
function isNormalized(a) { return /^-?[1-9](\.\d+)?$/.test(a); }
function trackHTML(numStr, shift) {
  const a = shiftNum(numStr, shift);
  return a.split("").map(ch => ch === "." ? `<span class="dp">.</span>` : `<span>${ch}</span>`).join("");
}
function shifterHTML(id, numStr, shift, label) {
  const a = shiftNum(numStr, shift);
  const ok = isNormalized(a);
  return `
  <div class="dtrack" id="${id}">
    <div class="dmeta"><span>${esc(label || "จำนวนตั้งต้น")}</span><span class="mono">${esc(numStr)}</span></div>
    <div class="digits">${trackHTML(numStr, shift)}</div>
    <div class="sci">${sciHTML(a, shift)}</div>
    <div class="dmeta">
      <span>เลื่อนแล้ว ${Math.abs(shift)} ตำแหน่ง (${shift > 0 ? "ไปทางซ้าย" : shift < 0 ? "ไปทางขวา" : "ยังไม่เลื่อน"})</span>
      <span style="color:${ok ? "#34D399" : "#FCA5A5"}">${ok ? "✓ อยู่ในรูปมาตรฐาน" : "ยังไม่ใช่รูปมาตรฐาน"}</span>
    </div>
  </div>`;
}

/* ============================================================

function lessonsDone(sid) { return new Set(DB.lessons.filter(l => l.studentId === sid).map(l => l.lessonId)).size; }
function bestActivity(sid, type) {
  const a = DB.activities.filter(x => x.studentId === sid && x.activityType === type);
  return a.length ? Math.max(...a.map(x => x.score)) : 0;
}
function bestGame(sid) { const g = DB.games.filter(x => x.studentId === sid); return g.length ? Math.max(...g.map(x => x.score)) : 0; }
function bestQuizPct(sid, kind) {
  const a = DB.attempts.filter(x => x.studentId === sid && (!kind || x.kind === kind));
  return a.length ? Math.max(...a.map(x => x.percentage)) : 0;
}
function scoreBreakdown(sid) {
  const lesson = Math.round(lessonsDone(sid) / LESSONS.length * CONFIG.POINTS.lesson);
  const activity = ACT_TYPES.reduce((s, t) => s + bestActivity(sid, t.key), 0);
  const game = Math.min(bestGame(sid), CONFIG.POINTS.game);
  const quiz = Math.round(bestQuizPct(sid, "post") ? bestQuizPct(sid, "post") / 100 * CONFIG.POINTS.quiz : bestQuizPct(sid) / 100 * CONFIG.POINTS.quiz);
  const total = clamp(lesson + activity + game + quiz, 0, 1000);
  return { lesson, activity, game, quiz, total };
}

let SHIFT = 0;
function shiftDemo(d, reset) {
  const L = LESSONS.find(x => x.id === +STATE.sub);

function checkPractice(lid, i) {
  const L = LESSONS.find(x => x.id === lid), p = L.practice[i];
  const val = $("#lp" + i).value, fb = $("#lpfb" + i);
  if (!val.trim()) { fb.innerHTML = `<div class="fb no">กรอกคำตอบก่อนกดตรวจ</div>`; return; }
  const ok = normAns(val) === normAns(p.a) || normAns(val) === normAns(p.a.replace("x10^", "×10^"));
  fb.innerHTML = ok
    ? `<div class="fb ok">🎉 ถูกต้อง! <div class="ex">คำตอบคือ ${esc(p.a)}</div></div>`
    : `<div class="fb no">💪 ลองอีกครั้งนะ <div class="ex">${esc(p.hint)}</div></div>`;
  if (!ok) $("#lp" + i).classList.add("shake"), setTimeout(() => $("#lp" + i).classList.remove("shake"), 400);
}
function finishLesson(id) {
  const sid = STATE.student.studentId;
  if (!DB.lessons.some(l => l.studentId === sid && l.lessonId === id)) {
    const rec = { studentId: sid, lessonId: id, completedAt: nowISO() };
    DB.lessons.push(rec); saveDB(); queueSync("lessons", rec);
    toast("บันทึกความก้าวหน้าแล้ว 📖", "ok");
  } else toast("บทนี้บันทึกไว้แล้ว", "");
  checkBadges();
  id < LESSONS.length ? go("lesson", id + 1) : go("lesson");
}
function checkBadges() {
  const sid = STATE.student && STATE.student.studentId; if (!sid) return;
  const prev = JSON.parse(localStorage.getItem("SCINOTE_BADGE_" + sid) || "[]");
  const now = BADGES.filter(b => b.cond(sid)).map(b => b.id);
  now.filter(b => !prev.includes(b)).forEach(id => {
    const b = BADGES.find(x => x.id === id);
    toast(`${b.ic} ได้รับเหรียญใหม่: ${b.name}!`, "ok");
  });
  localStorage.setItem("SCINOTE_BADGE_" + sid, JSON.stringify(now));
}

function startAct(k) {

  if (k === "match") ACT = { sel: null, pairs: [], left: shuffle(ACT_DATA.match.map((m, i) => ({ i, t: m[0] }))), right: shuffle(ACT_DATA.match.map((m, i) => ({ i, t: m[1] }))), wrong: 0 };
  if (k === "order") ACT = { list: shuffle(ACT_DATA.order.map((t, i) => ({ i, t }))), checked: false };

function gameAnswer(k) {

}

function quizStart(quizId, sessionId) {
  const quiz = DB.quizzes.find(q => q.quizId === quizId);
  const sid = STATE.student.studentId;
  if (attemptsUsed(sid, quizId) >= quiz.maxAttempts) { toast("ทำแบบทดสอบครบจำนวนครั้งแล้ว", "warn"); return; }
  let ids = quiz.questionIds.slice();
  if (quiz.shuffleQ) ids = shuffle(ids);
  ids = ids.slice(0, CONFIG.MAX_QUIZ_QUESTIONS);
  const items = ids.map(id => {
    const q = DB.questions.find(x => x.questionId === id);
    let opts = [];
    if (q.type === "mc") opts = ["A", "B", "C", "D"].filter(k => q["choice" + k]).map(k => ({ k, t: q["choice" + k] }));
    if (q.type === "tf") opts = [{ k: "A", t: q.choiceA || "จริง" }, { k: "B", t: q.choiceB || "เท็จ" }];
    if (quiz.shuffleC && opts.length) opts = shuffle(opts); // สลับตำแหน่งแสดงผล แต่ key ยังผูกกับเฉลยเดิม
    return { q, opts };
  });
  STATE.run = { type: "quiz", quiz, sessionId, items, idx: 0, ans: {}, startedAt: nowISO(), timeLeft: quiz.timeLimit * 60, submitted: false, result: null };
  go("quizRun"); quizTimer();
}

/* ============================================================
   CHARTS (SVG/HTML แบบไม่พึ่งไลบรารีภายนอก)
   ============================================================ */
function barChart(items, max, unit) {
  const m = max || Math.max(1, ...items.map(i => i.value || 0));
  return `<div style="margin-top:10px">${items.map(i => `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:.88rem"><span>${esc(i.label)}</span>
      <b class="mono">${i.value == null ? "-" : i.value}${unit || ""}</b></div>
      <div class="pbar"><i style="width:${clamp((i.value || 0) / m * 100, 0, 100)}%;background:${i.color || "var(--blue)"}"></i></div>
    </div>`).join("")}</div>`;
}
function pieChart(items) {
  const total = items.reduce((s, i) => s + i.value, 0) || 1;
  let acc = 0, r = 60, c = 2 * Math.PI * r;
  const segs = items.map(i => {
    const len = i.value / total * c, off = acc; acc += len;
    return `<circle r="${r}" cx="80" cy="80" fill="transparent" stroke="${i.color}" stroke-width="34"
      stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(i.label)}: ${i.value}</title></circle>`;
  }).join("");
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center">
    <svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="แผนภูมิวงกลม">${segs}
      <circle r="40" cx="80" cy="80" fill="#fff"></circle>
      <text x="80" y="86" text-anchor="middle" font-family="Kanit" font-size="20" fill="#13235B">${total}</text></svg>
    <div>${items.map(i => `<div style="font-size:.9rem"><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${i.color};margin-right:6px"></i>${esc(i.label)} — <b>${i.value}</b></div>`).join("")}</div>
  </div>`;
}

/* ---------- สถิติรวม ---------- */
function classStats(cls) {
  const studs = DB.students.filter(s => !cls || s.class === cls);
  const att = DB.attempts.filter(a => studs.some(s => s.studentId === a.studentId));
  const pctList = studs.map(s => bestQuizPct(s.studentId)).filter(x => x > 0).sort((a, b) => a - b);
  const avg = pctList.length ? Math.round(pctList.reduce((a, b) => a + b, 0) / pctList.length * 10) / 10 : 0;
  const med = pctList.length ? (pctList.length % 2 ? pctList[(pctList.length - 1) / 2] : Math.round((pctList[pctList.length / 2 - 1] + pctList[pctList.length / 2]) / 2 * 10) / 10) : 0;
  const pass = pctList.filter(p => p >= CONFIG.PASS_PERCENT).length;
  return { studs, att, avg, med, pass, fail: pctList.length - pass, max: pctList.length ? pctList[pctList.length - 1] : 0, min: pctList.length ? pctList[0] : 0, tested: pctList.length };
}
function missedQuestions(limit) {
  const map = {};
  DB.answers.forEach(a => { const m = map[a.questionId] || (map[a.questionId] = { n: 0, w: 0 }); m.n++; if (!a.isCorrect) m.w++; });
  return Object.entries(map).map(([id, m]) => ({ id, pct: pct(m.w, m.n), n: m.n, q: DB.questions.find(x => x.questionId === id) }))
    .filter(x => x.q).sort((a, b) => b.pct - a.pct).slice(0, limit || 5);
}
function topicWeakness() {
  return Object.keys(TOPICS).map(t => {
    const ids = DB.questions.filter(q => q.topic === t).map(q => q.questionId);
    const rows = DB.answers.filter(a => ids.includes(a.questionId));
    const wrongPct = rows.length ? pct(rows.filter(r => !r.isCorrect).length, rows.length) : 0;
    const p = 100 - wrongPct;
    const lv = !rows.length ? ["bg-x", "⚪ ยังไม่มีข้อมูล"] : p >= 80 ? ["bg-e", "🟢 เข้าใจดี"] : p >= 50 ? ["bg-m", "🟡 ควรทบทวน"] : ["bg-h", "🔴 ต้องเสริม"];
    return { key: t, name: TOPICS[t], wrongPct, correctPct: p, cls: lv[0], label: lv[1], n: rows.length };
  }).sort((a, b) => b.wrongPct - a.wrongPct);
}

      <option value="tf" ${q.type === "tf" ? "selected" : ""}>ถูก / ผิด</option>
      <option value="fill" ${q.type === "fill" ? "selected" : ""}>เติมคำตอบ</option></select>
    <label class="f">โจทย์ *</label><textarea class="inp" id="e_q" rows="3">${esc(q.question)}</textarea>
    <div id="choiceBox">
      ${["A", "B", "C", "D"].map(k => `<div id="w_${k}"><label class="f">ตัวเลือก ${k}</label><input class="inp" id="e_${k}" value="${esc(q["choice" + k])}"></div>`).join("")}
    </div>
    <label class="f">คำตอบที่ถูก *</label>
    <input class="inp mono" id="e_ans" value="${esc(q.answer)}" placeholder="ปรนัย/ถูกผิด: A B C D · เติมคำตอบ: พิมพ์คำตอบ">
    <label class="f">คำอธิบาย / วิธีคิด *</label><textarea class="inp" id="e_ex" rows="2">${esc(q.explanation)}</textarea>
    <div class="grid g3" style="gap:10px">
      <div><label class="f">หัวข้อ</label><select class="inp" id="e_topic">${Object.entries(TOPICS).map(([k, v]) => `<option value="${k}" ${q.topic === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div><label class="f">ระดับความยาก</label><select class="inp" id="e_diff">${Object.entries(DIFF).map(([k, v]) => `<option value="${k}" ${q.difficulty === k ? "selected" : ""}>${v.ic} ${v.th}</option>`).join("")}</select></div>
      <div><label class="f">คะแนน</label><input class="inp" id="e_pt" type="number" min="1" max="10" value="${q.points}"></div>
    </div>
    <label class="f">สถานะ</label><select class="inp" id="e_st"><option value="active" ${q.status === "active" ? "selected" : ""}>ใช้งาน</option><option value="off" ${q.status !== "active" ? "selected" : ""}>ปิดใช้งาน</option></select>
    <div id="eErr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn gh" onclick="closeModal()">ยกเลิก</button>
      <button class="btn ok" onclick="qSave('${id || ""}')">💾 บันทึก</button></div>`);
  qTypeToggle();
}
function qTypeToggle() {
  const t = $("#e_type").value;
  $("#choiceBox").style.display = t === "fill" ? "none" : "block";
  ["C", "D"].forEach(k => { const w = $("#w_" + k); if (w) w.style.display = t === "tf" ? "none" : "block"; });
  if (t === "tf") { if (!$("#e_A").value) $("#e_A").value = "จริง"; if (!$("#e_B").value) $("#e_B").value = "เท็จ"; }
}
function qSave(id) {
  const type = $("#e_type").value, ans = $("#e_ans").value.trim();
  const data = { question: $("#e_q").value.trim(), explanation: $("#e_ex").value.trim(), topic: $("#e_topic").value, difficulty: $("#e_diff").value, points: clamp(+$("#e_pt").value || 1, 1, 10), status: $("#e_st").value, type, answer: ans };
  ["A", "B", "C", "D"].forEach(k => data["choice" + k] = type === "fill" ? "" : $("#e_" + k).value.trim());
  const err = [];
  if (data.question.length < 5) err.push("กรอกโจทย์อย่างน้อย 5 ตัวอักษร");
  if (!ans) err.push("ระบุคำตอบที่ถูก");
  if (type === "mc" && !["A", "B", "C", "D"].includes(ans.toUpperCase())) err.push("ข้อปรนัย: คำตอบต้องเป็น A, B, C หรือ D");
  if (type === "mc" && ["A", "B", "C", "D"].some(k => !data["choice" + k])) err.push("ข้อปรนัยต้องกรอกตัวเลือกให้ครบ 4 ข้อ");
  if (type === "tf" && !["A", "B"].includes(ans.toUpperCase())) err.push("ข้อถูก/ผิด: คำตอบต้องเป็น A หรือ B");
  if (!data.explanation) err.push("กรอกคำอธิบายเพื่อให้นักเรียนทบทวนได้");
  if (err.length) { $("#eErr").innerHTML = err.map(e => `<div class="err-msg">• ${e}</div>`).join(""); return; }
  if (type !== "fill") data.answer = ans.toUpperCase();
  if (id) { Object.assign(DB.questions.find(x => x.questionId === id), data); toast("แก้ไขข้อสอบแล้ว", "ok"); queueSync("questions", { questionId: id, ...data }); }
  else {
    let n = 1; while (DB.questions.some(q => q.questionId === "Q" + String(n).padStart(3, "0"))) n++;  // กันรหัสซ้ำ
    const rec = { questionId: "Q" + String(n).padStart(3, "0"), ...data, createdAt: nowISO() };
    DB.questions.push(rec); toast("เพิ่มข้อสอบ " + rec.questionId + " แล้ว", "ok"); queueSync("questions", rec);
  }
  saveDB(); closeModal(); render();
}
function qDelete(id) {
  const used = DB.quizzes.filter(q => q.questionIds.includes(id));
  if (used.length && !confirm(`ข้อนี้ถูกใช้ในแบบทดสอบ ${used.length} ชุด ลบแล้วจะถูกนำออกจากชุดนั้นด้วย ยืนยันลบ?`)) return;
  if (!used.length && !confirm("ยืนยันลบข้อสอบ " + id + "?")) return;
  DB.questions = DB.questions.filter(q => q.questionId !== id);
  DB.quizzes.forEach(q => q.questionIds = q.questionIds.filter(x => x !== id));
  saveDB(); toast("ลบข้อสอบแล้ว", ""); render();
}

/* ---------- สร้างแบบทดสอบ (PART 10) ---------- */
let QB = null;
function tQuizzes() {
  if (QB) return qbForm();
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <h2 class="sec-title" style="flex:1">🧪 แบบทดสอบ (${DB.quizzes.length} ชุด)</h2>

  <div class="hint" style="margin:8px 0">กติกาของระบบ: แบบทดสอบแต่ละครั้งไม่เกิน <b>${CONFIG.MAX_QUIZ_QUESTIONS} ข้อ</b> และตั้งค่าเริ่มต้นเป็นข้อระดับ <b>ง่าย</b></div>
  ${DB.quizzes.length ? `<div class="tbl-wrap"><table><thead><tr><th>ชื่อแบบทดสอบ</th><th>ประเภท</th><th>จำนวนข้อ</th><th>เวลา</th><th>ทำได้</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>
    ${DB.quizzes.map(q => `<tr>
      <td><b>${esc(q.title)}</b><div class="hint">${esc(q.description || "")}</div></td>
      <td><span class="badge ${q.kind === "pre" ? "bg-p" : q.kind === "post" ? "bg-b" : "bg-x"}">${q.kind === "pre" ? "ก่อนเรียน" : q.kind === "post" ? "หลังเรียน" : "ทั่วไป"}</span></td>
      <td class="mono">${q.questionIds.length}</td><td class="mono">${q.timeLimit} น.</td><td class="mono">${q.maxAttempts} ครั้ง</td>
      <td><span class="badge ${q.status === "open" ? "bg-e" : "bg-x"}">${q.status === "open" ? "เปิด" : "ปิด"}</span></td>
      <td style="white-space:nowrap">
        <button class="btn sm gh" onclick="qbNew('${q.quizId}')">✏️</button>
        <button class="btn sm gh" onclick="toggleQuiz('${q.quizId}')">${q.status === "open" ? "⏸️" : "▶️"}</button>
        <button class="btn sm dg" onclick="delQuiz('${q.quizId}')">🗑️</button></td></tr>`).join("")}
  </tbody></table></div>` : `<div class="card empty"><span class="ico">🧪</span>ยังไม่มีแบบทดสอบ กด “สร้างแบบทดสอบ” เพื่อเริ่ม</div>`}`;
}
function qbNew(id) {
  const q = id ? JSON.parse(JSON.stringify(DB.quizzes.find(x => x.quizId === id)))
    : { quizId: "", title: "", description: "", kind: "post", questionIds: [], timeLimit: 15, startDate: "", endDate: "", status: "open", shuffleQ: true, shuffleC: true, maxAttempts: 1 };
  QB = { data: q, filter: id ? "" : CONFIG.DEFAULT_DIFFICULTY };
  render();
}
function qbForm() {
  const d = QB.data;
  const pool = DB.questions.filter(q => q.status === "active" && (!QB.filter || q.difficulty === QB.filter));
  const total = d.questionIds.reduce((t, id) => t + (DB.questions.find(x => x.questionId === id) || { points: 0 }).points, 0);
  return `<div class="crumb"><button class="btn gh sm" onclick="QB=null;render()">← กลับ</button>
    <h2 class="sec-title">${d.quizId ? "แก้ไขแบบทดสอบ" : "สร้างแบบทดสอบ"}</h2></div>
  <div class="grid g2">
    <div class="card">
      <label class="f">ชื่อแบบทดสอบ *</label><input class="inp" id="qb_t" value="${esc(d.title)}" placeholder="แบบทดสอบหลังเรียน เรื่องสัญกรณ์วิทยาศาสตร์">
      <label class="f">คำอธิบาย</label><input class="inp" id="qb_d" value="${esc(d.description)}">
      <div class="grid g2" style="gap:10px">
        <div><label class="f">ประเภท</label><select class="inp" id="qb_k">
          <option value="pre" ${d.kind === "pre" ? "selected" : ""}>ก่อนเรียน (Pre-test)</option>
          <option value="post" ${d.kind === "post" ? "selected" : ""}>หลังเรียน (Post-test)</option>
          <option value="general" ${d.kind === "general" ? "selected" : ""}>ทั่วไป</option></select></div>
        <div><label class="f">เวลา (นาที)</label><input class="inp" id="qb_tl" type="number" min="1" max="120" value="${d.timeLimit}"></div>
        <div><label class="f">วันเริ่ม</label><input class="inp" id="qb_sd" type="date" value="${esc(d.startDate)}"></div>
        <div><label class="f">วันสิ้นสุด</label><input class="inp" id="qb_ed" type="date" value="${esc(d.endDate)}"></div>
        <div><label class="f">ทำได้กี่ครั้ง</label><input class="inp" id="qb_ma" type="number" min="1" max="10" value="${d.maxAttempts}"></div>
        <div><label class="f">สถานะ</label><select class="inp" id="qb_st"><option value="open" ${d.status === "open" ? "selected" : ""}>เปิด</option><option value="closed" ${d.status !== "open" ? "selected" : ""}>ปิด</option></select></div>
      </div>
      <label class="f">การสุ่ม</label>
      <label style="display:block"><input type="checkbox" id="qb_sq" ${d.shuffleQ ? "checked" : ""}> สุ่มลำดับข้อ</label>
      <label style="display:block"><input type="checkbox" id="qb_sc" ${d.shuffleC ? "checked" : ""}> สุ่มลำดับตัวเลือก (เฉลยผูกกับตัวเลือกเดิม ไม่ทำให้คำตอบผิด)</label>
      <div class="card tight" style="margin-top:12px;background:#EEF2FF">
        เลือกแล้ว <b>${d.questionIds.length}</b>/${CONFIG.MAX_QUIZ_QUESTIONS} ข้อ · คะแนนเต็ม <b>${total}</b>
        <div class="pbar pmini" style="margin-top:6px"><i style="width:${d.questionIds.length / CONFIG.MAX_QUIZ_QUESTIONS * 100}%"></i></div>

        <button class="btn gh" onclick="QB.data.questionIds=[];render()">ล้างที่เลือก</button>
      </div>
    </div>
    <div class="card">
      <h3>เลือกข้อสอบจากคลัง</h3>
      <label class="f">กรองระดับความยาก</label>
      <select class="inp" onchange="QB.filter=this.value;render()">
        <option value="">ทุกระดับ</option>${Object.entries(DIFF).map(([k, v]) => `<option value="${k}" ${QB.filter === k ? "selected" : ""}>${v.ic} ${v.th}</option>`).join("")}</select>
      <div style="max-height:420px;overflow:auto;margin-top:10px">
        ${pool.map(q => { const on = d.questionIds.includes(q.questionId);
          return `<label class="choice ${on ? "sel" : ""}" style="cursor:pointer;margin-bottom:8px">
            <input type="checkbox" ${on ? "checked" : ""} onchange="qbToggle('${q.questionId}')" style="width:20px;height:20px;margin-top:4px">
            <span style="flex:1"><b class="mono">${q.questionId}</b> ${q.question.slice(0, 58)}${q.question.length > 58 ? "…" : ""}
            <div class="hint">${DIFF[q.difficulty].ic} ${DIFF[q.difficulty].th} · ${esc(TOPICS[q.topic])} · ${q.points} คะแนน</div></span></label>`; }).join("")}

}
function qbToggle(id) {
  const ids = QB.data.questionIds, i = ids.indexOf(id);
  if (i >= 0) ids.splice(i, 1);
  else { if (ids.length >= CONFIG.MAX_QUIZ_QUESTIONS) { toast(`เลือกได้สูงสุด ${CONFIG.MAX_QUIZ_QUESTIONS} ข้อต่อชุด`, "warn"); render(); return; } ids.push(id); }
  render();
}
function qbAuto() {
  const pool = DB.questions.filter(q => q.status === "active" && (!QB.filter || q.difficulty === QB.filter));
  QB.data.questionIds = shuffle(pool).slice(0, CONFIG.MAX_QUIZ_QUESTIONS).map(q => q.questionId);
  toast(`สุ่มมาให้ ${QB.data.questionIds.length} ข้อแล้ว`, "ok"); render();
}
function qbSave() {
  const d = QB.data;
  d.title = $("#qb_t").value.trim(); d.description = $("#qb_d").value.trim();
  d.kind = $("#qb_k").value; d.timeLimit = clamp(+$("#qb_tl").value || 15, 1, 120);
  d.startDate = $("#qb_sd").value; d.endDate = $("#qb_ed").value;
  d.maxAttempts = clamp(+$("#qb_ma").value || 1, 1, 10); d.status = $("#qb_st").value;
  d.shuffleQ = $("#qb_sq").checked; d.shuffleC = $("#qb_sc").checked;
  const err = [];
  if (d.title.length < 4) err.push("ตั้งชื่อแบบทดสอบอย่างน้อย 4 ตัวอักษร");
  if (!d.questionIds.length) err.push("เลือกข้อสอบอย่างน้อย 1 ข้อ");
  if (d.questionIds.length > CONFIG.MAX_QUIZ_QUESTIONS) err.push(`เลือกได้ไม่เกิน ${CONFIG.MAX_QUIZ_QUESTIONS} ข้อ`);
  if (d.startDate && d.endDate && new Date(d.startDate) > new Date(d.endDate)) err.push("วันเริ่มต้องมาก่อนวันสิ้นสุด");
  if (err.length) { $("#qbErr").innerHTML = err.map(e => `<div class="err-msg">• ${e}</div>`).join(""); return; }
  if (d.quizId) { Object.assign(DB.quizzes.find(x => x.quizId === d.quizId), d); toast("บันทึกการแก้ไขแล้ว", "ok"); }
  else { let n = 1; while (DB.quizzes.some(q => q.quizId === "QZ" + String(n).padStart(3, "0"))) n++;
    d.quizId = "QZ" + String(n).padStart(3, "0"); d.createdAt = nowISO(); DB.quizzes.push(d); toast("สร้างแบบทดสอบ " + d.quizId + " แล้ว", "ok"); }
  queueSync("quizzes", d); saveDB(); QB = null; render();
}
function toggleQuiz(id) { const q = DB.quizzes.find(x => x.quizId === id); q.status = q.status === "open" ? "closed" : "open"; saveDB(); render(); }
function delQuiz(id) {
  if (DB.attempts.some(a => a.quizId === id)) { toast("ลบไม่ได้: มีนักเรียนทำแบบทดสอบชุดนี้แล้ว ให้กด ⏸️ ปิดแทน", "warn"); return; }
  if (!confirm("ยืนยันลบแบบทดสอบ " + id + "?")) return;
  DB.quizzes = DB.quizzes.filter(q => q.quizId !== id);
  DB.sessions = DB.sessions.filter(s => s.quizId !== id);
  saveDB(); toast("ลบแบบทดสอบแล้ว", ""); render();
}

/* ---------- Session + QR Code (PART 11, 12) ---------- */
function genJoinCode() {
  let c; do { c = "SCI-M1-" + Math.floor(1000 + Math.random() * 9000); } while (DB.sessions.some(s => s.joinCode === c));
  return c;
}
function tSessions() {
  const open = DB.sessions.filter(s => s.status === "open");
  return `<h2 class="sec-title">🔗 Session & QR Code</h2>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>สร้าง Session ใหม่</h3>
      <label class="f">แบบทดสอบ / กิจกรรม</label>
      <select class="inp" id="s_quiz">${DB.quizzes.map(q => `<option value="${q.quizId}">${esc(q.title)} (${q.questionIds.length} ข้อ)</option>`).join("")}</select>
      <label class="f">ห้องเรียน</label>
      <select class="inp" id="s_class">${["ม.1/1","ม.1/2","ม.1/3","ม.1/4","ม.1/5"].map(c => `<option>${c}</option>`).join("")}</select>
      <label class="f">ชื่อเรียก Session</label><input class="inp" id="s_title" placeholder="เช่น ก่อนเรียน — ม.1/1 คาบ 3">
      <button class="btn pri block" style="margin-top:14px" onclick="createSession()">🔗 สร้าง Session + QR Code</button>
      ${DB.quizzes.length ? "" : `<div class="err-msg">สร้างแบบทดสอบก่อนอย่างน้อย 1 ชุด</div>`}
    </div>
    <div class="card"><h3>🟢 Session ที่กำลังเปิด (${open.length})</h3>
      ${open.length ? open.map(s => {
        const joined = DB.attempts.filter(a => a.sessionId === s.sessionId);
        const names = [...new Set(joined.map(a => a.studentId))].map(id => (DB.students.find(x => x.studentId === id) || {}).name).filter(Boolean);
        return `<div class="card tight" style="margin-bottom:10px">
          <b>${esc(s.title)}</b><div class="hint">${esc(s.className)} · เปิดเมื่อ ${fmtDT(s.startTime)}</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
            <span class="joincode" style="font-size:1rem">${esc(s.joinCode)}</span>
            <span class="chip" style="background:#DCFCE7;color:#166534;border-color:#86EFAC">👥 นักเรียนเข้าร่วม ${names.length} คน</span>
          </div>
          ${names.length ? `<div class="hint" style="margin-top:6px">${names.slice(0, 8).map((n, i) => `${i + 1}. ${esc(n)}`).join(" · ")}${names.length > 8 ? " …" : ""}</div>` : `<div class="hint" style="margin-top:6px">ยังไม่มีนักเรียนส่งคำตอบ</div>`}
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            <button class="btn sm" onclick="showQR('${s.sessionId}')">📱 แสดง QR Code</button>
            <button class="btn sm gh" onclick="copyCode('${s.joinCode}')">📋 คัดลอกรหัส</button>
            <button class="btn sm dg" onclick="closeSession('${s.sessionId}')">⏹️ ปิด Session</button>
          </div></div>`; }).join("")
      : `<div class="empty"><span class="ico">🔗</span>ยังไม่มี Session ที่เปิด กดสร้างด้านซ้ายเพื่อเริ่มคาบเรียน</div>`}
    </div>
  </div>
  ${DB.sessions.filter(s => s.status !== "open").length ? `<h3 style="margin-top:18px">Session ที่ปิดแล้ว</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Session</th><th>รหัส</th><th>ห้อง</th><th>เปิด</th><th>ปิด</th><th>ผู้ทำ</th></tr></thead><tbody>
    ${DB.sessions.filter(s => s.status !== "open").map(s => `<tr><td>${esc(s.title)}</td><td class="mono">${esc(s.joinCode)}</td><td>${esc(s.className)}</td>
      <td class="hint">${fmtDT(s.startTime)}</td><td class="hint">${fmtDT(s.endTime)}</td>
      <td class="mono">${DB.attempts.filter(a => a.sessionId === s.sessionId).length}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
}
function createSession() {
  const quizId = $("#s_quiz").value; if (!quizId) { toast("ยังไม่มีแบบทดสอบให้เลือก", "warn"); return; }
  const quiz = DB.quizzes.find(q => q.quizId === quizId);
  const cls = $("#s_class").value, title = $("#s_title").value.trim() || `${quiz.title} — ${cls}`;
  const s = { sessionId: uid("SES"), quizId, className: cls, title, joinCode: genJoinCode(), startTime: nowISO(), endTime: "", status: "open", createdAt: nowISO() };
  DB.sessions.push(s); saveDB(); queueSync("sessions", s);
  toast("สร้าง Session แล้ว รหัส " + s.joinCode, "ok");
  render(); showQR(s.sessionId);
}
function closeSession(id) {
  if (!confirm("ปิด Session นี้? นักเรียนจะเข้าร่วมด้วยรหัสนี้ไม่ได้อีก")) return;
  const s = DB.sessions.find(x => x.sessionId === id); s.status = "closed"; s.endTime = nowISO();
  saveDB(); queueSync("sessions", s); render();
}
function copyCode(c) {

    : toast("รหัสคือ " + c, "");
}
function showQR(id) {
  const s = DB.sessions.find(x => x.sessionId === id);

  modal(`<h3>📱 QR Code สำหรับเข้าร่วม</h3>
    <div class="qr-box">
      <div style="font-family:'Kanit';font-weight:600;color:var(--navy)">${esc(s.title)}</div>
      <div id="qrHost" style="display:flex;justify-content:center;margin:14px 0"></div>
      <div class="joincode">${esc(s.joinCode)}</div>

      <button class="btn" onclick="downloadQR('${esc(s.joinCode)}')">📥 ดาวน์โหลด QR Code</button>
      <button class="btn gh" onclick="printQR('${esc(s.title)}','${esc(s.joinCode)}')">🖨️ พิมพ์ QR Code</button>
      <button class="btn gh" onclick="copyCode('${esc(s.joinCode)}')">📋 คัดลอกรหัส</button>
      <button class="btn gh" onclick="closeModal()">ปิด</button></div>`);
  const host = $("#qrHost");
  if (window.QRCode && !window.__QR_FAIL) {
    try { new QRCode(host, { text: url, width: 200, height: 200, colorDark: "#13235B", colorLight: "#ffffff" }); }

function qrFallback(code) {
  return `<div class="card tight" style="background:#FFFBEB;border-color:#FDE68A;max-width:280px">
    ⚠️ สร้าง QR Code ไม่ได้ในโหมดออฟไลน์ (ต้องต่ออินเทอร์เน็ตเพื่อโหลดไลบรารี QR)

}
function qrCanvas() { const m = $("#qrHost"); return m ? (m.querySelector("canvas") || null) : null; }
function downloadQR(code) {
  const c = qrCanvas();
  if (!c) { toast("ไม่มีรูป QR ให้ดาวน์โหลด ใช้รหัส " + code + " แทนได้", "warn"); return; }
  const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "QR-" + code + ".png"; a.click();
  toast("ดาวน์โหลด QR Code แล้ว", "ok");
}
function printQR(title, code) {
  const c = qrCanvas();
  const img = c ? `<img src="${c.toDataURL("image/png")}" style="width:280px">` : `<div style="font-size:2rem;font-family:monospace">${code}</div>`;
  const w = window.open("", "_blank", "width=600,height=760");
  if (!w) { toast("เบราว์เซอร์บล็อกหน้าต่างพิมพ์ ให้อนุญาต popup ก่อน", "warn"); return; }
  w.document.write(`<html><head><title>QR ${code}</title><meta charset="utf-8">
    <style>body{font-family:sans-serif;text-align:center;padding:40px}h1{font-size:22px}
    .c{font-family:monospace;font-size:30px;letter-spacing:3px;border:2px dashed #999;display:inline-block;padding:8px 18px;margin-top:14px}</style></head>
    <body><h1>${title}</h1>${img}<div class="c">${code}</div><p>สแกน QR หรือกรอกรหัสนี้ที่หน้าเข้าร่วมชั้นเรียน</p>
    <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

function studentReport(sid) {
  const s = DB.students.find(x => x.studentId === sid), b = scoreBreakdown(sid), r = rankOf(b.total);
  const pre = bestQuizPct(sid, "pre"), post = bestQuizPct(sid, "post");
  const gain = pre ? Math.round((post - pre) * 10) / 10 : null;
  const mine = DB.attempts.filter(a => a.studentId === sid);
  const wrong = DB.answers.filter(a => mine.some(m => m.attemptId === a.attemptId) && !a.isCorrect);
  const byTopic = {};
  wrong.forEach(w => { const q = DB.questions.find(x => x.questionId === w.questionId); if (q) byTopic[q.topic] = (byTopic[q.topic] || 0) + 1; });
  const weak = Object.entries(byTopic).sort((a, b) => b[1] - a[1]);
  const strong = topicMastery(sid).filter(t => t.pct !== null && t.pct >= 80);
  const advice = weak.length
    ? `นักเรียน${strong.length ? `มีความเข้าใจเรื่อง${strong[0].name}เป็นอย่างดี แต่` : ""}ควรทบทวนเรื่อง${TOPICS[weak[0][0]]} ซึ่งตอบผิดมากที่สุด ${weak[0][1]} ข้อ`
    : mine.length ? "นักเรียนตอบถูกทุกข้อที่ทำไป ควรให้โจทย์ระดับยากขึ้นเพื่อท้าทายเพิ่มเติม" : "ยังไม่มีข้อมูลการทำแบบทดสอบ";
  modal(`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><h3 style="margin:0">${esc(s.name)}</h3><div class="hint">เลขที่ ${s.number} · ${esc(s.class)} · ${esc(s.studentId)}</div></div>
      <div style="text-align:right"><div class="dsp" style="font-size:1.6rem;color:var(--navy2)">${b.total}/1000</div>
      <span class="badge bg-b">${r.icon} ${r.name}</span></div></div>
    <div class="grid g4" style="margin:14px 0">
      <div class="stat"><div class="lb">บทเรียน</div><div class="vl">${b.lesson}</div></div>
      <div class="stat p"><div class="lb">กิจกรรม</div><div class="vl">${b.activity}</div></div>
      <div class="stat y"><div class="lb">เกม</div><div class="vl">${b.game}</div></div>
      <div class="stat g"><div class="lb">แบบทดสอบ</div><div class="vl">${b.quiz}</div></div>
    </div>
    <h4>กราฟพัฒนาการ</h4>
    ${barChart([{ label: "Pre-test", value: pre, color: "#A855F7" }, { label: "Activity", value: pct(b.activity, 200), color: "#2563EB" },
      { label: "Game", value: pct(b.game, 300), color: "#38BDF8" }, { label: "Post-test", value: post, color: "#059669" }], 100, "%")}
    ${gain !== null ? `<div class="fb ${gain >= 0 ? "ok" : "no"}">${gain >= 0 ? `📈 คะแนนหลังเรียนเพิ่มขึ้น ${gain}% (Learning Gain)` : `📉 คะแนนหลังเรียนลดลง ${Math.abs(gain)}%`}</div>` : ""}
    <h4 style="margin-top:14px">หัวข้อที่ผิดบ่อย</h4>
    ${weak.length ? weak.map(([t, n]) => `<div class="kv"><b>${esc(TOPICS[t])}</b><span class="badge bg-h">ผิด ${n} ข้อ</span></div>`).join("") : `<div class="hint">ไม่มีข้อผิด</div>`}
    <h4 style="margin-top:14px">ประวัติการทำแบบทดสอบ</h4>
    ${mine.length ? mine.map(a => { const q = DB.quizzes.find(x => x.quizId === a.quizId) || {};
      return `<div class="kv"><b>${esc(q.title || a.quizId)}</b><span><span class="mono">${a.score}/${a.totalPoints} (${a.percentage}%)</span>
      <button class="btn sm gh" onclick="closeModal();openReview('${a.attemptId}')">ดูข้อที่ผิด</button></span></div>`; }).join("") : `<div class="hint">ยังไม่ได้ทำแบบทดสอบ</div>`}
    <div class="card tight" style="background:#FFFBEB;border-color:#FDE68A;margin-top:14px"><b>ข้อเสนอแนะ:</b> ${esc(advice)}</div>
    <div style="text-align:right;margin-top:12px"><button class="btn gh" onclick="closeModal()">ปิด</button></div>`);
}

function dl(name, text, mime) {
  const blob = new Blob(["\uFEFF" + text], { type: (mime || "text/csv") + ";charset=utf-8;" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("ดาวน์โหลด " + name + " แล้ว", "ok");
}
const csvCell = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
const csvRows = rows => rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function exportScores() {
  const rows = [["ชื่อ-นามสกุล", "เลขที่", "ห้อง", "คะแนนก่อนเรียน(%)", "กิจกรรม", "เกม", "Quiz", "คะแนนรวม", "เปอร์เซ็นต์", "ระดับผลการเรียนรู้"]];
  DB.students.slice().sort((a, b) => a.class.localeCompare(b.class) || a.number - b.number).forEach(s => {
    const b = scoreBreakdown(s.studentId);
    rows.push([s.name, s.number, s.class, bestQuizPct(s.studentId, "pre"), b.activity, b.game, b.quiz, b.total, pct(b.total, 1000), rankOf(b.total).name]);
  });
  dl("คะแนนนักเรียน-สัญกรณ์วิทยาศาสตร์.csv", csvRows(rows));
}
function exportAnswers() {
  const rows = [["attemptId", "ชื่อนักเรียน", "แบบทดสอบ", "questionId", "หัวข้อ", "คำตอบที่เลือก", "คำตอบที่ถูก", "ถูก/ผิด", "คะแนน"]];
  DB.answers.forEach(a => {
    const at = DB.attempts.find(x => x.attemptId === a.attemptId); if (!at) return;
    const s = DB.students.find(x => x.studentId === at.studentId) || {}, q = DB.questions.find(x => x.questionId === a.questionId) || {};
    rows.push([a.attemptId, s.name, (DB.quizzes.find(x => x.quizId === at.quizId) || {}).title, a.questionId, TOPICS[q.topic] || "", a.selectedAnswer, a.correctAnswer, a.isCorrect ? "ถูก" : "ผิด", a.points]);
  });
  dl("คำตอบรายข้อ.csv", csvRows(rows));
}
function exportQuestions() {
  const rows = [["questionId", "question", "choiceA", "choiceB", "choiceC", "choiceD", "answer", "explanation", "difficulty", "topic", "points"]];
  DB.questions.forEach(q => rows.push([q.questionId, q.question, q.choiceA, q.choiceB, q.choiceC, q.choiceD, q.answer, q.explanation, DIFF[q.difficulty].th, TOPICS[q.topic], q.points]));
  dl("คลังข้อสอบ.csv", csvRows(rows));
}
function exportJSON() { dl("scinote-backup.json", JSON.stringify(DB, null, 2), "application/json"); }

  $("#apiState").innerHTML = '<span class="load"></span> กำลังทดสอบ…';
  try { await apiCall("ping", {}); SYNC.status = "synced"; $("#apiState").textContent = "🟢 Connected"; toast("เชื่อมต่อสำเร็จ", "ok"); }
  catch (e) { SYNC.status = "error"; $("#apiState").textContent = "⚠️ เชื่อมต่อไม่ได้: " + e.message; toast("ไม่สามารถเชื่อมต่อฐานข้อมูลได้ ระบบจะบันทึกข้อมูลไว้ชั่วคราวในเครื่อง", "warn"); }
  renderSyncChip();
}
function importJSON(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.questions || !d.students) throw new Error("โครงสร้างไฟล์ไม่ถูกต้อง");
      DB = d; saveDB(); toast("กู้คืนข้อมูลเรียบร้อย", "ok"); render();
    } catch (e) { toast("อ่านไฟล์ไม่สำเร็จ: " + e.message, "no"); }
  };
  r.readAsText(f);
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  loadDB(); seedData();
  CONFIG.API_URL = localStorage.getItem("SCINOTE_API_URL") || CONFIG.API_URL;
  SYNC.status = CONFIG.API_URL ? "waiting" : "offline";
  if (localStorage.getItem(MOTION_KEY) === "1") { document.body.classList.add("reduce-motion"); }
  const sid = localStorage.getItem(CUR_KEY);
  if (sid) STATE.student = DB.students.find(s => s.studentId === sid) || null;
  const code = new URLSearchParams(location.search).get("code");
  if (code && !STATE.student) go("studentJoin");
  else if (STATE.student) go("student");
  else go("landing");
  if (localStorage.getItem(MOTION_KEY) === "1") $("#motionBtn").textContent = "🎬 เปิด Animation";
  window.addEventListener("online", () => { if (CONFIG.API_URL) syncNow(true); });
  window.onerror = function (m) { console.error(m); return false; };
})();

</script>
